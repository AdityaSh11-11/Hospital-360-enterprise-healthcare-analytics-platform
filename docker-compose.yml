services:

  postgres:
    image: postgres:17

    container_name: hospital360_postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: hospital360
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - hospital360_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d hospital360"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  hospital360_postgres_data: